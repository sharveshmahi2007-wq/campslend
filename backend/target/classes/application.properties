# ===================================================================
# CampusLend / LendLoop Application Configuration
# ===================================================================
server.port=8080
spring.application.name=campuslend-api

# Local MongoDB Community Server Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/campuslend_db
spring.data.mongodb.auto-index-creation=true

# JSON & Error Handling
spring.jackson.deserialization.fail-on-unknown-properties=false
server.error.include-message=always
server.error.include-binding-errors=always

# Logging
logging.level.com.campuslend=INFO
logging.level.org.springframework.data.mongodb=INFO

