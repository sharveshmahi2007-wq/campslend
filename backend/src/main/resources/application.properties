# ===================================================================
# CampusLend / LendLoop Application Configuration
# ===================================================================
server.port=8080
spring.application.name=campuslend-api

# Local MongoDB Community Server Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/campuslend_db
spring.data.mongodb.auto-index-creation=true

# PSG iTech College Authentication & OTP Configuration
app.security.college-domain=psgitech.ac.in
app.security.otp.expiration-minutes=5
app.security.otp.max-attempts=5
app.security.otp.resend-cooldown-seconds=60

# Mail Configuration (Supports Gmail SMTP or Brevo SMTP via Env Vars)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JSON & Error Handling
spring.jackson.deserialization.fail-on-unknown-properties=false
server.error.include-message=always
server.error.include-binding-errors=always

# Logging
logging.level.com.campuslend=INFO
logging.level.org.springframework.data.mongodb=INFO
