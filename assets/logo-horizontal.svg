<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="blueHGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0047b3"/>
      <stop offset="50%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenHGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Mark: Scaled Infinity Symbol -->
  <g transform="translate(10, 10) scale(0.24)">
    <!-- Blue Loop Arrow -->
    <path d="M 175 145 C 115 145, 75 185, 75 245 C 75 305, 115 345, 175 345 C 220 345, 248 318, 280 278 L 242 248 C 222 274, 202 295, 175 295 C 142 295, 125 272, 125 245 C 125 218, 142 195, 175 195 C 202 195, 225 215, 252 246 L 240 262 L 295 245 L 282 190 L 268 206 C 240 172, 212 145, 175 145 Z" fill="url(#blueHGrad)"/>
    <!-- Green Loop Arrow -->
    <path d="M 337 145 C 292 145, 264 172, 232 212 L 270 242 C 290 216, 310 195, 337 195 C 370 195, 387 218, 387 245 C 387 272, 370 295, 337 295 C 310 295, 287 275, 260 244 L 272 228 L 217 245 L 230 300 L 244 284 C 272 318, 300 345, 337 345 C 397 345, 437 305, 437 245 C 437 185, 397 145, 337 145 Z" fill="url(#greenHGrad)"/>
    <!-- Center white holes -->
    <circle cx="175" cy="245" r="44" fill="#ffffff" />
    <circle cx="337" cy="245" r="44" fill="#ffffff" />
    <!-- Hammer -->
    <g transform="translate(175, 245) rotate(-35) translate(-175, -245)">
      <rect x="156" y="222" width="36" height="15" rx="3" fill="#002753"/>
      <rect x="171" y="237" width="7" height="30" rx="2" fill="#002753"/>
    </g>
    <!-- Grad Cap -->
    <g transform="translate(337, 245)">
      <polygon points="0,-14 24,-2 0,9 -24,-2" fill="#14532d"/>
      <path d="M -14,4 C -14,12 14,12 14,4 Z" fill="#14532d"/>
      <path d="M 0,-2 C 14,0 20,6 20,14" stroke="#14532d" stroke-width="2.5" fill="none"/>
    </g>
  </g>

  <!-- Typography Right -->
  <text x="135" y="52" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="34" font-weight="800" fill="#002753" letter-spacing="-1px">Lend<tspan fill="#16a34a">Loop</tspan></text>
</svg>
